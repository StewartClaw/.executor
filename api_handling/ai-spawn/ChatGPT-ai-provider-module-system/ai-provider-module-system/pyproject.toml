[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-provider-module-system"
version = "0.1.0"
description = "Pluggable AI summarization for text and structured data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
pandas = ["pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
